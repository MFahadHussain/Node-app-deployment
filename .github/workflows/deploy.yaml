name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}        # Your EC2 Public IP or Domain
          username: ubuntu                     # Standard Ubuntu AMI username
          key: ${{ secrets.EC2_SSH_KEY }}      # Your private SSH key stored in GitHub Secrets
          script: |
            cd /var/www/fastapi-project
            git pull origin main
            sudo docker build --no-cache -t fastapi-app .
            sudo docker stop fastapi-container 2>/dev/null || true
            sudo docker rm fastapi-container 2>/dev/null || true
            sudo docker run -d -p 8000:8000 --name fastapi-container --restart unless-stopped fastapi-app
